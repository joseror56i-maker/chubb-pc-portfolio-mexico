name: Reporting quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reporting-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Test data quality controls
        run: python -m unittest discover -s tests -v
      - name: Verify reporting snapshot
        run: python src/data_processing/validate_portfolio.py --verify-snapshot
